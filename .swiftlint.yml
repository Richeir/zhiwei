# PLAN §4.1：静态检查。规则取向——拦真问题，不拦风格口水仗。
# 本地/CI 同一份配置（Scripts/ci-local.sh 与 .github/workflows/ci.yml 都指到这里）。

excluded:
  - ZhiWei.xcodeproj
  - build
  - .build
  - Vendor

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - explicit_init
  - first_where
  - identical_operands
  - joined_default_parameter
  - operator_usage_whitespace
  - overridden_super_call
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

disabled_rules:
  - todo
  - trailing_comma
  - multiple_closures_with_trailing_closure   # SwiftUI 常态
  - type_name                                 # 允许 TimelineModel.Phase 之类的短名
  - function_parameter_count

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_interpolated_strings: true

file_length:
  warning: 500
  error: 900

type_body_length:
  warning: 350
  error: 600

function_body_length:
  warning: 80
  error: 150

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 60
    error: 80
  allowed_symbols: ["_"]

nesting:
  type_level:
    warning: 3

reporter: "xcode"
